name: CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - published


jobs:
  MacOS:
    name:
      Build Native Executables and Python Wheels on ${{ matrix.platform }} (for ${{ matrix.python.std_version }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos-15-intel, macos-15 ]
        python:
          - std_version: "3.10"
            cibw_version: "cp310-"
          - std_version: "3.11"
            cibw_version: "cp311-"
          - std_version: "3.12"
            cibw_version: "cp312-"
          - std_version: "3.13"
            cibw_version: "cp313-"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: checkout vcell-ode repo
        uses: actions/checkout@v6

      - name: Install MacOS dependencies <x86_64>
        if: matrix.platform == 'macos-15-intel'
        shell: bash
        run: |
          brew install conan spdlog
          conan --version
          mkdir -p ~/.conan2/profiles/
          touch ~/.conan2/profiles/default # if we don't make a file first, cp thinks its a folder that doesn't exist
          cp conan-profiles/CI-CD/MacOS-AMD64_profile.txt ~/.conan2/profiles/default

      - name: Install MacOS dependencies <ARM>
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          brew install conan spdlog
          conan --version
          mkdir -p ~/.conan2/profiles/
          touch ~/.conan2/profiles/default # if we don't make a file first, cp thinks its a folder that doesn't exist
          cp conan-profiles/CI-CD/MacOS-ARM64_profile.txt ~/.conan2/profiles/default

      - name: Install Dependencies through Conan on MacOS
        shell: bash
        run: |
          conan install . --output-folder build --build=missing          

      - name: Build Mac
        run: |
          echo "working dir is $PWD"
          cd build
          source conanbuild.sh
          cmake -B . -S .. -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Fix MacOS shared object paths
        shell: bash
        run: |
          mkdir build/upload
          cd build/bin
          ls *_x64   | awk '{print $1}' | xargs -I '{}' otool -L '{}' | grep ")" | grep -v "build" | grep -v "System" | grep -v "/usr/lib/" | awk '{print $1}' | xargs -I '{}' cp -vn '{}' . || true
          ls *.dylib | awk '{print $1}' | xargs -I '{}' otool -L '{}' | grep ")" | grep -v "build" | grep -v "System" | grep -v "/usr/lib/" | awk '{print $1}' | xargs -I '{}' cp -vn '{}' . || true
          ls *.dylib | awk '{print $1}' | xargs -I '{}' otool -L '{}' | grep ")" | grep -v "build" | grep -v "System" | grep -v "/usr/lib/" | awk '{print $1}' | xargs -I '{}' cp -vn '{}' . || true
          chmod u+w,+x *
          tar czvf ../upload/mac64_bad_paths.tgz .
          ../../.github/scripts/install_name_tool_macos.sh
          tar czvf ../upload/mac64.tgz --dereference .

      - name: Test Mac
        run: |
          cd build
          ctest -VV
          echo "------ running SundialsSolverStandalone_x64 ------"
          ./bin/SundialsSolverStandalone_x64 || true

      - name: Upload Intel Macos binaries
        if: matrix.platform == 'macos-15-intel' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: macos_x86_64
          path: build/upload/mac64.tgz

      - name: Upload ARM Macos binaries
        if: matrix.platform == 'macos-15' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: macos_arm64
          path: build/upload/mac64.tgz

      - name: Build Wheels
        uses: pypa/cibuildwheel@v3.4.0
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        env:
          MACOSX_DEPLOYMENT_TARGET: 15.0
          CIBW_BUILD: "${{ matrix.python.cibw_version }}*"
          CIBW_ARCHES: "native"
          CIBW_CONFIG_SETTINGS: >-
            cmake.args=-DOPTION_TARGET_PYTHON_BINDING=ON

      - name: Upload Python Wheel
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        with:
          name: pyvcell-ode-${{ matrix.platform }}-${{ matrix.python.cibw_version }}-cibw-wheels
          path: ./wheelhouse/*.whl

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false


  WindowsOS:
    name:
      Build Native Executables and Python Wheels on ${{ matrix.platform }} (for ${{ matrix.python.std_version }})
    strategy:
      fail-fast: false
      matrix:
        #platform: [ windows-latest, windows-11-arm ]
        platform: [ windows-latest ]
        python:
          - std_version: "3.10"
            cibw_version: "cp310-"
          - std_version: "3.11"
            cibw_version: "cp311-"
          - std_version: "3.12"
            cibw_version: "cp312-"
          - std_version: "3.13"
            cibw_version: "cp313-"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Pre-install Configuration <x86_64>
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo "CONAN_PROFILE_NAME=Windows-AMD64_profile.txt" >> $GITHUB_ENV
          echo "CONAN_ENV_PATH=${{ github.workspace }}/build/conan_toolchain.cmake" | sed 's/\\/\//g' >> $GITHUB_ENV

      - name: Pre-install Configuration <ARM64>
        if: matrix.platform == 'windows-11-arm'
        shell: bash
        run: |
          echo "CONAN_PROFILE_NAME=Windows-ARM64_profile.txt" >> $GITHUB_ENV
          echo "CONAN_ENV_PATH=${{ github.workspace }}/build/conan_toolchain.cmake" | sed 's/\\/\//g' >> $GITHUB_ENV
      - name: checkout vcell-ode repo
        uses: actions/checkout@v6

      - name: Install Windows Dependencies (Part 0 - Setup LLVM-style)
        uses: llvm/actions/setup-windows@main
        with:
          arch: amd64

      - name: Install Windows Dependencies (Part 1 - Configure Conan ...et all)
        shell: powershell
        run: |
          choco install zip -y
          choco install conan -y
          vcpkg install spdlog
          $conanDir = "C:\Program Files\Conan\conan"
          $env:PATH = "$conanDir;$env:PATH"
          $conanDir | Set-Content -Path $env:GITHUB_PATH
          $env:CONAN_HOME = "C:\.conan"
          "CONAN_HOME=C:\.conan" | Out-File -FilePath $env:GITHUB_ENV -Append
          conan --version
          conan profile detect --force  
          

      - name: Install Windows Dependencies (Part 2 - Reconfigure Conan)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp conan-profiles/CI-CD/${{ env.CONAN_PROFILE_NAME }} $CONAN_HOME/profiles/default

      - name: Install Dependencies through Conan on Windows
        shell: powershell
        run: |
          conan install . --output-folder build --build=missing -o include_messaging=False

      - name: Build Windows
        shell: powershell
        run: |
          cd build
          ./conanbuild.ps1
          cmake -B . -S .. -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Make Windows Shared Object Paths Relative
        shell: bash
        run: |
          mkdir build/upload
          cd build/bin
          ls *.exe | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep '=> /' | grep -v build | grep -iv windows | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          # Currently, Sundials only requires system32 dlls! 
          # ls *.dll | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep '=> /' | grep -v build | grep -iv windows | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          # ls *.dll | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep '=> /' | grep -v build | grep -iv windows | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          chmod u+w,+x *
          zip ../upload/win64.zip ./*
          cd ../..
          # fi

      - name: Test Windows
        run: |
          cd build
          ctest -VV
          ./bin/SundialsSolverStandalone_x64 || true

      - name: Upload Windows (x86_64) binaries
        if: matrix.platform == 'windows-latest' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: win64_x86_64
          path: build/upload/win64.zip

      - name: Upload Windows (ARMv8) binaries
        if: matrix.platform == 'windows-11-arm' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: win64_arm64
          path: build/upload/win64.zip

      - name: Modify Archive Name <ARM64>
        if: matrix.platform == 'windows-11-arm' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        run: |
          mv build/upload/win64.zip build/upload/win64arm.zip

      - name: Attach Windows Binaries to Release <x86_64>
        uses: softprops/action-gh-release@v3
        if: matrix.platform == 'windows-latest' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        with:
          files: |
            build/upload/win64.zip

      - name: Attach Linux Binaries to Release <ARM64>
        uses: softprops/action-gh-release@v3
        if: matrix.platform == 'windows-11-arm' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        with:
          files: |
            build/upload/win64arm.zip

      - name: Set up Python ${{ matrix.python.std_version  }}
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.std_version }}

      - name: Build Wheels (Windows)
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        env:
          CC: clang-cl
          CXX: clang-cl
          CMAKE_GENERATOR: Ninja
        run: |
          cd $env:GITHUB_WORKSPACE
          . $env:GITHUB_WORKSPACE/build/conanbuild.ps1
          python3 -m pip install build h5py
          python3 -m build --wheel -o ./wheelhouse -C cmake.args="-DCMAKE_TOOLCHAIN_FILE=${{ env.CONAN_ENV_PATH }}" -C cmake.define.OPTION_TARGET_PYTHON_BINDING=ON

      - name: Upload Python Wheel
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        uses: actions/upload-artifact@v7
        with:
          name: pyvcell-fv-${{ matrix.platform }}-${{ matrix.python.cibw_version }}-cibw-wheels
          path: ./wheelhouse/*.whl

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

  GNULinux:
    name:
      Build Native Executables and Python Wheels on ${{ matrix.platform }} (for ${{ matrix.python.std_version }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, ubuntu-24.04-arm ]
        python:
          - std_version: "3.10"
            cibw_version: "cp310-"
          - std_version: "3.11"
            cibw_version: "cp311-"
          - std_version: "3.12"
            cibw_version: "cp312-"
          - std_version: "3.13"
            cibw_version: "cp313-"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Pre-install Configuration <x86_64>
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          echo "CONAN_PROFILE_NAME=Linux-AMD64_profile.txt" >> $GITHUB_ENV

      - name: Pre-install Configuration <ARM64>
        if: matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          echo "CONAN_PROFILE_NAME=Linux-ARM64_profile.txt" >> $GITHUB_ENV

      - name: checkout vcell-ode repo
        uses: actions/checkout@v6

      - name: Install Linux Dependencies <x86_64>
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y wget
          wget --version
          wget https://github.com/conan-io/conan/releases/download/2.22.2/conan-2.22.2-amd64.deb
          sudo apt install -y ./conan-*.deb
          conan --version
          mkdir -p ~/.conan2/profiles/
          touch ~/.conan2/profiles/default # if we don't make a file first, cp thinks its a folder that doesn't exist
          cp conan-profiles/CI-CD/Linux-AMD64_profile.txt ~/.conan2/profiles/default

      - name: Install Linux Dependencies <ARM>
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt update
          python3 -m pip install conan
          conan --version
          mkdir -p ~/.conan2/profiles/
          touch ~/.conan2/profiles/default # if we don't make a file first, cp thinks its a folder that doesn't exist
          cp conan-profiles/CI-CD/Linux-ARM64_profile.txt ~/.conan2/profiles/default


      - name: Install Dependencies through Conan on Linux <x86_64>
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt --purge remove gcc
          sudo ln -s /usr/bin/clang /usr/bin/cc
          sudo apt install mold libc++-dev libc++abi-dev
          sudo rm /usr/bin/ld
          sudo ln -s $(which mold) /usr/bin/ld
          conan install -v trace . --output-folder build --build=missing

      - name: Install Dependencies through Conan on Linux <ARM>
        if: matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          sudo apt --purge remove gcc
          sudo ln -s /usr/bin/clang /usr/bin/cc
          sudo ln -s /usr/bin/clang /usr/bin/gcc
          sudo ln -s /usr/bin/clang++ /usr/bin/g++
          sudo apt install mold libc++-dev libc++abi-dev
          sudo rm /usr/bin/ld
          sudo ln -s $(which mold) /usr/bin/ld
          conan install . --output-folder build --build=missing

      - name: Build Linux
        run: |
          echo "working dir is $PWD"
          cd build
          source conanbuild.sh
          cmake -B . -S .. -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Make Linux Shared Object Paths Relative
        shell: bash
        run: |
          mkdir build/upload
          cd build/bin
          ls *_x64   | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep "=> /" | grep -v "build" | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          ls *.so    | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep "=> /" | grep -v "build" | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          ls *.so    | awk '{print $1}' | xargs -I '{}' ldd '{}' | grep "=> /" | grep -v "build" | awk '{print $3}' | xargs -I '{}' cp -vn '{}' . || true
          chmod u+w,+x *
          tar czvf ../upload/linux64.tgz --dereference .
          cd ../..

      - name: Test Linux
        run: |
          cd build

          ctest -VV

          echo "------ running SundialsSolverStandalone_x64 ------"
          ./bin/SundialsSolverStandalone_x64 || true

      - name: Upload Linux (x86_64) binaries
        if: matrix.platform == 'ubuntu-latest' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: linux64_x86_64
          path: build/upload/linux64.tgz

      - name: Upload Linux (ARM64) binaries
        if: matrix.platform == 'ubuntu-24.04-arm' && matrix.python.std_version == '3.12' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        uses: actions/upload-artifact@v7
        with:
          name: linux64_arm64
          path: build/upload/linux64.tgz

      - name: Modify Archive Name <ARM64>
        if: matrix.platform == 'ubuntu-24.04-arm' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        run: |
          mv build/upload/linux64.tgz build/upload/linux64arm.tgz

      - name: Attach Linux Binaries to Release <x86_64>
        uses: softprops/action-gh-release@v3
        if: matrix.platform == 'ubuntu-latest' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        with:
          files: |
            build/upload/linux64.tgz

      - name: Attach Linux Binaries to Release <ARM64>
        uses: softprops/action-gh-release@v3
        if: matrix.platform == 'ubuntu-24.04-arm' && matrix.python.std_version == '3.12' && github.event_name == 'release' && github.event.action == 'published'
        with:
          files: |
            build/upload/linux64arm.tgz

      - name: Login to GitHub Container Registry
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wheels with CIBuildWheel (via Docker) <x86_64>
        uses: pypa/cibuildwheel@v3.4.0
        if: matrix.platform == 'ubuntu-latest' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        env:
          CIBW_BUILD: "${{ matrix.python.cibw_version }}*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "native"
          CIBW_MANYLINUX_X86_64_IMAGE: 'ghcr.io/virtualcell/fvsolver_manylinux_2_28_x86_64:0.1.3'
          CIBW_REPAIR_WHEEL_COMMAND: 'LD_LIBRARY_PATH=/usr/local/lib/x86_64-unknown-linux-gnu:$LD_LIBRARY_PATH auditwheel repair --disable-isa-ext-check {wheel} -w {dest_dir}'
          CIBW_CONFIG_SETTINGS_LINUX: >-
            cmake.args=-DCMAKE_TOOLCHAIN_FILE=/project/build/conan_toolchain.cmake
            cmake.args=-DOPTION_TARGET_PYTHON_BINDING=ON
          CIBW_ENVIRONMENT_LINUX: CC="clang" CXX="clang++"
          CIBW_BEFORE_BUILD: |
            echo $PWD
            # dnf install mold perl-core-y
            python3 -m pip install conan
            mkdir -p /root/.conan2/profiles/
            cp conan-profiles/CI-CD/${{ env.CONAN_PROFILE_NAME }} /root/.conan2/profiles/default
            conan install . --output-folder /project/build --build=missing --build="m4/*"
            echo "source /project/build/conanbuild.sh" >> ~/.profile
            echo "source /project/build/conanbuild.sh" >> ~/.bashrc
            source /project/build/conanbuild.sh

      - name: Build Wheels with CIBuildWheel (via Docker) <ARM64>
        uses: pypa/cibuildwheel@v3.4.0
        if: matrix.platform == 'ubuntu-24.04-arm' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published'))
        env:
          CIBW_BUILD: "${{ matrix.python.cibw_version }}*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "native"
          CIBW_MANYLINUX_AARCH64_IMAGE: 'ghcr.io/virtualcell/fvsolver_manylinux_2_28_aarch64:0.1.3'
          CIBW_REPAIR_WHEEL_COMMAND: 'LD_LIBRARY_PATH=/usr/local/lib/aarch64-unknown-linux-gnu:$LD_LIBRARY_PATH auditwheel repair --disable-isa-ext-check {wheel} -w {dest_dir}'
          CIBW_CONFIG_SETTINGS_LINUX: >-
            cmake.args=-DCMAKE_TOOLCHAIN_FILE=/project/build/conan_toolchain.cmake
            cmake.args=-DOPTION_TARGET_PYTHON_BINDING=ON
          CIBW_ENVIRONMENT_LINUX: CC="clang" CXX="clang++"
          CIBW_BEFORE_BUILD: |
            echo $PWD
            # dnf install mold perl-core -y
            python3 -m pip install conan
            mkdir -p /root/.conan2/profiles/
            cp conan-profiles/CI-CD/${{ env.CONAN_PROFILE_NAME }} /root/.conan2/profiles/default
            conan install . --output-folder /project/build --build=missing --build="m4/*"
            echo "source /project/build/conanbuild.sh" >> ~/.profile
            echo "source /project/build/conanbuild.sh" >> ~/.bashrc
            source /project/build/conanbuild.sh


      - name: Upload Python Wheel
        if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
        uses: actions/upload-artifact@v7
        with:
          name: pyvcell-fv-${{ matrix.platform }}-${{ matrix.python.cibw_version }}-cibw-wheels
          path: ./wheelhouse/*.whl

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false


  MacOS-Universal:
    name: Create Universal macOS Binary
    runs-on: macos-15
    if: github.event_name == 'pull_request' || (github.event_name == 'release' && github.event.action == 'published')
    needs:
      - MacOS

    steps:
      # The binaries are "named" (ID'd) different as artifacts, but not as filenames (`mac64.tgz`).
      # As soon as we download one of them we need to rename it to avoid overwriting the other one.
      - name: Download macOS-Arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: macos_arm64
          path: binaries

      - name: Unpack & Rename macOS-Arm64 binary
        run: |
          mkdir binaries/arm
          tar xzvf binaries/mac64.tgz -C binaries/arm
          rm binaries/mac64.tgz

      - name: Download macOS-x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos_x86_64
          path: binaries

      - name: Unpack & Rename macOS-x86_64 binary
        run: |
          mkdir binaries/intel
          tar xzvf binaries/mac64.tgz -C binaries/intel
          rm binaries/mac64.tgz

      # this will go in the log of the run, useful for debugging
      - name: Inspect binaries directory
        run: |
          echo "Contents of binaries/:"
          ls -Rlh binaries/

      # - name: Setup tmate session for inspection
      #   uses: mxschmitt/action-tmate@v3

      - name: Combine with lipo
        run: |
          mkdir binaries/universal
          for exe in `ls binaries/arm/ | grep ".*x64"`
          do
            echo "fixing ${exe}..."
            lipo  -create binaries/arm/$exe binaries/intel/${exe} \
                  -output  binaries/universal/${exe}
          done
          
          for dylib in `ls binaries/arm/ | grep ".*\.dylib"`
          do
            echo "fixing ${dylib}..."
            lipo  -create  binaries/arm/$dylib binaries/intel/${dylib} \
                  -output  binaries/universal/${dylib}
          done
          for entry in `ls binaries/universal/`
          do
            echo "confirming ${entry}..."
            lipo -archs binaries/universal/${entry}
          done
          mv binaries/universal binaries/mac64
          cd binaries
          tar czvf macos-universal.tgz mac64

      - name: Inspect binaries directory
        run: |
          echo "Contents of binaries/:"
          ls -Rlh binaries/

      - name: Upload MacOS (Universal) binaries
        uses: actions/upload-artifact@v7
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          name: macos64_universal
          path: binaries/macos-universal.tgz

      - name: Rename MacOS Native Binaries for Release
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          mv binaries/macos-universal.tgz binaries/mac64.tgz

      - name: Attach MacOS Native Binaries to Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          files: |
            binaries/mac64.tgz

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false